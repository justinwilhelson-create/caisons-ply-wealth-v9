</style></head><body><div id="lock" class="hidden"><div class="card stack"><h2>🔐 CAISONSPLY Wealth</h2><p class="muted">Masukkan PIN aplikasi</p><input id="unlockPin" type="password" inputmode="numeric" placeholder="PIN"><button class="primary" onclick="unlock()">Buka aplikasi</button><small id="lockmsg"></small></div></div><header><div class="row"><div class="brand-wrap"><img id="brandLogo" class="brand-logo hidden" alt="Logo"><div><b>CAISONSPLY <span class="gold">WEALTH</span></b><div class="muted">v9 PRO · Mobile Edition</div></div></div><span class="pill" id="saveStatus">● Tersimpan</span></div></header><main id="main"></main><nav id="nav"></nav><dialog id="dlg"><div id="dialogBody"></div></dialog><script>
const KEY='caison-wealth-v9';let db={assets:[],tx:[],snapshots:[],settings:{theme:'dark',pinHash:'',goal:1000000000,logo:''},version:9};const clone=x=>JSON.parse(JSON.stringify(x));let current='home',filter='Semua';const fmt=n=>'Rp'+Math.round(Number(n)||0).toLocaleString('id-ID');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>globalThis.crypto?.randomUUID?.()||String(Date.now())+Math.random();const total=a=>a.filter(x=>x.kind!=='debt').reduce((s,x)=>s+Number(x.value||0),0);const debts=a=>a.filter(x=>x.kind==='debt').reduce((s,x)=>s+Number(x.value||0),0);const net=()=>total(db.assets)-debts(db.assets);const liquid=()=>db.assets.filter(x=>x.kind!=='debt'&&['Bank','E-Wallet','Tunai'].includes(x.category)).reduce((s,x)=>s+Number(x.value||0),0);function save(){try{localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('saveStatus').textContent='● Tersimpan'}catch(e){document.getElementById('saveStatus').textContent='● Mode Pratinjau'}}function snapshot(){db.snapshots.push({at:new Date().toISOString(),value:net()});if(db.snapshots.length>3000)db.snapshots.shift()}function mutate(f){f();snapshot();save();render()}function dialog(html){document.getElementById('dialogBody').innerHTML=html+'<div style="margin-top:16px"><button onclick="dlg.close()">Tutup</button></div>';document.getElementById('dlg').showModal()}const field=(name,label,type='text',value='')=>`<label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${type==='number'?'step="any"':''} required>`;const cats=['Bank','E-Wallet','Tunai','Stok Usaha','Saham','Emas','Mata Uang Asing','Piutang','Properti','Lainnya'];function assetForm(editId){const a=db.assets.find(x=>x.id===editId)||{name:'',category:'Bank',kind:'asset',value:0};dialog(`<h2>${editId?'Edit':'Tambah'} Aset / Utang</h2><form id="assetForm" class="stack">${field('name','Nama','text',a.name)}<label>Jenis</label><select name="kind"><option value="asset" ${a.kind!=='debt'?'selected':''}>Aset</option><option value="debt" ${a.kind==='debt'?'selected':''}>Utang</option></select><label>Kategori</label><select name="category">${cats.map(c=>`<option ${a.category===c?'selected':''}>${c}</option>`).join('')}</select>${field('value','Nilai (Rp)','number',a.value)}<button class="primary">Simpan</button></form>`);document.getElementById('assetForm').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const n=Number(d.value);if(!Number.isFinite(n)||n<0)return alert('Nilai tidak valid');mutate(()=>{const x={...a,name:d.name.trim(),kind:d.kind,category:d.category,value:n,id:editId||id()};if(editId)db.assets=db.assets.map(y=>y.id===editId?x:y);else db.assets.push(x)});dlg.close()}}
function delAsset(i){if(!confirm('Hapus aset ini? Transaksi historis tidak dihapus.'))return;mutate(()=>db.assets=db.assets.filter(a=>a.id!==i))}function transact(type){const available=db.assets.filter(a=>a.kind!=='debt');if(!available.length)return alert('Tambahkan aset terlebih dahulu');dialog(`<h2>${type==='transfer'?'Transfer Antar Aset':type==='income'?'Pemasukan':'Pengeluaran'}</h2><form id="txForm">${field('description','Keterangan','text',type==='transfer'?'Transfer internal':'')} ${field('amount','Nominal rupiah','number',0)}${type==='expense'?'<label>Kategori pengeluaran</label><select name="category"><option>Makan & Minum</option><option>Belanja</option><option>Transportasi</option><option>Operasional Usaha</option><option>Tagihan</option><option>Lainnya</option></select>':''}<label>${type==='income'?'Masuk ke':'Sumber dana'}</label><select name="from">${available.map(a=>`<option value="${esc(a.id)}">${esc(a.name)} (${fmt(a.value)})</option>`).join('')}</select>${type==='transfer'?`<label>Tujuan</label><select name="to">${available.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select>`:''}<button class="primary" style="margin-top:15px">Konfirmasi</button></form>`);document.getElementById('txForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),n=Number(d.amount),from=db.assets.find(a=>a.id===d.from),to=db.assets.find(a=>a.id===d.to);if(!(n>0))return alert('Nominal harus lebih dari nol');if(type==='transfer'&&from===to)return alert('Rekening sumber dan tujuan harus berbeda');if(type!=='income'&&from.value<n)return alert('Saldo tidak cukup');mutate(()=>{from.value+=type==='income'?n:-n;if(to)to.value+=n;db.tx.unshift({id:id(),type,amount:n,description:d.description,category:d.category||'',from:from.id,to:to?.id||null,at:new Date().toISOString()})});dlg.close()}}
function home(){let g=db.settings.goal||1e9;return `<div class="card hero"><small>TOTAL KEKAYAAN BERSIH</small><div class="money">${fmt(net())}</div><small>Aset kotor dikurangi total utang</small></div><div class="grid"><div class="card"><small>Aset Kotor</small><div class="num">${fmt(total(db.assets))}</div></div><div class="card"><small>Uang Liquid</small><div class="num green">${fmt(liquid())}</div></div><div class="card"><small>Total Utang</small><div class="num red">${fmt(debts(db.assets))}</div></div><div class="card"><small>Jumlah Aset</small><div class="num">${db.assets.length}</div></div></div><div class="card" style="margin-top:14px"><div class="row"><h3>Pergerakan Kekayaan</h3><select id="period" style="width:110px" onchange="drawChart()"><option value="1">1D</option><option value="7">7D</option><option value="30">1B</option><option value="365">1T</option><option value="0">ALL</option></select></div><canvas id="chart" height="180"></canvas><small>Grafik berdasarkan snapshot yang tercatat sejak menggunakan v9. Tidak mengarang histori lama.</small></div><div class="card"><div class="row"><h3>Target Kekayaan</h3><strong class="gold">${(net()/g*100).toFixed(2)}%</strong></div><progress value="${Math.max(0,Math.min(100,net()/g*100))}" max="100"></progress><div class="row"><small>Target ${fmt(g)}</small><small>Sisa ${fmt(Math.max(0,g-net()))}</small></div></div><div class="card"><h3>Aksi Cepat</h3><div class="buttons"><button class="greenbtn" onclick="transact('income')">+ Pemasukan</button><button class="danger" onclick="transact('expense')">− Pengeluaran</button><button onclick="transact('transfer')">⇄ Transfer</button></div></div><div class="card"><h3>Komposisi Aset</h3>${composition()}</div>`}
function composition(){let groups={};db.assets.filter(a=>a.kind!=='debt').forEach(a=>groups[a.category]=(groups[a.category]||0)+a.value);let sum=total(db.assets);return Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><small>${esc(k)}</small><b>${(v/sum*100).toFixed(1)}% · ${fmt(v)}</b></div><progress value="${v}" max="${sum||1}"></progress>`).join('')||'<p class="muted">Belum ada aset.</p>'}
function assets(){let list=db.assets.filter(a=>filter==='Semua'||(filter==='Utang'?a.kind==='debt':a.category===filter));return `<div class="row"><h2>Aset & Utang</h2><button class="primary" onclick="assetForm()">+ Tambah</button></div><div class="tabs">${['Semua','Bank','Stok Usaha','Emas','Piutang','Utang','Saham','Mata Uang Asing'].map(x=>`<button ${x===filter?'class="primary"':''} onclick="filter=${JSON.stringify(x)};render()">${x}</button>`).join('')}</div><input style="margin:10px 0" placeholder="Cari aset..." oninput="document.querySelectorAll('[data-asset]').forEach(x=>x.hidden=!x.dataset.asset.toLowerCase().includes(this.value.toLowerCase()))"><div class="card">${list.map(a=>`<div class="asset" data-asset="${esc(a.name)}"><div class="row"><div><b>${esc(a.name)}</b><div><small>${esc(a.kind==='debt'?'UTANG':a.category)}${a.quantity?' · '+a.quantity+' '+esc(a.unit||'unit'):''}</small></div></div><b class="${a.kind==='debt'?'red':'green'}">${fmt(a.value)}</b></div><div class="buttons" style="margin-top:9px"><button onclick="assetForm('${a.id}')">Edit</button><button class="danger" onclick="delAsset('${a.id}')">Hapus</button></div></div>`).join('')||'<p class="muted">Belum ada data. Tambahkan aset atau impor backup v8.</p>'}</div>`}
function expenseAnalysis(){let groups={};db.tx.filter(t=>t.type==='expense').forEach(t=>{let k=t.category||'Tanpa kategori';groups[k]=(groups[k]||0)+Number(t.amount||0)});return Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join('')||'<p class="muted">Belum ada pengeluaran.</p>'}function transactions(){let day=new Date().toDateString(),today=db.tx.filter(t=>new Date(t.at).toDateString()===day);let sum=t=>today.filter(x=>x.type===t).reduce((s,x)=>s+x.amount,0);return `<h2>Transaksi</h2><div class="buttons"><button class="greenbtn" onclick="transact('income')">+ Pemasukan</button><button class="danger" onclick="transact('expense')">− Pengeluaran</button><button onclick="transact('transfer')">⇄ Transfer</button></div><div class="card" style="margin-top:15px"><h3>Ringkasan Hari Ini</h3><div class="row"><span class="green">Masuk ${fmt(sum('income'))}</span><span class="red">Keluar ${fmt(sum('expense'))}</span></div></div><h3>Riwayat Transaksi (${db.tx.length})</h3><div class="card">${db.tx.map(t=>`<div class="asset row"><div><b>${esc(t.description||t.type)}</b><div><small>${new Date(t.at).toLocaleString('id-ID')} · ${esc(t.type)}</small></div></div><strong class="${t.type==='expense'?'red':'green'}">${t.type==='expense'?'-':t.type==='income'?'+':'⇄'}${fmt(t.amount)}</strong></div>`).join('')||'<p class="muted">Belum ada transaksi.</p>'}</div><div class="card"><h3>Analisis Pengeluaran</h3><b class="red">${fmt(db.tx.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0))}</b><p class="muted">Total pengeluaran yang dicatat di v9 / diimpor.</p>${expenseAnalysis()}</div>`}
function assistant(){return `<h2>Asisten Keuangan</h2><div class="card"><p>Asisten lokal bisa menjawab pertanyaan dasar dan menyiapkan tindakan. Tidak terhubung ke AI cloud.</p><div id="answer" class="card">Coba: "berapa total kekayaan", "berapa utang", "berapa uang liquid", "berapa target tersisa".</div><textarea id="ask" rows="3" placeholder="Tanya tentang kekayaanmu..."></textarea><button class="primary" onclick="askAssistant()">Kirim</button></div>`}function askAssistant(){let q=document.getElementById('ask').value.toLowerCase(),ans='Saya belum memahami pertanyaan ini. Gunakan menu Aset atau Transaksi untuk perubahan data.';if(q.includes('utang'))ans='Total utang: '+fmt(debts(db.assets));else if(q.includes('liquid')||q.includes('likuid'))ans='Uang liquid: '+fmt(liquid());else if(q.includes('target')||q.includes('miliar'))ans='Sisa target: '+fmt(Math.max(0,db.settings.goal-net()));else if(q.includes('kekayaan')||q.includes('aset'))ans='Kekayaan bersih: '+fmt(net());document.getElementById('answer').textContent=ans}
function debtPayment(i){let a=db.assets.find(x=>x.id===i);if(!a)return;dialog(`<h2>Pembayaran ${esc(a.name)}</h2><form id="payForm">${field('amount','Jumlah pembayaran (Rp)','number',0)}<button class="primary">Catat pembayaran</button></form>`);document.getElementById('payForm').onsubmit=e=>{e.preventDefault();let n=Number(new FormData(e.target).get('amount'));if(!(n>0)||n>a.value)return alert('Nominal pembayaran tidak valid');mutate(()=>{a.value-=n;db.tx.unshift({id:id(),type:'debt-payment',amount:n,description:'Pembayaran '+a.name,at:new Date().toISOString()})});dlg.close()}}function settings(){return `<h2>Pengaturan</h2><div class="card"><h3>Tampilan</h3><button onclick="toggleTheme()">🌓 Ganti Mode Terang / Gelap</button><label>Target kekayaan (Rp)</label><input type="number" id="goal" value="${db.settings.goal}"><button onclick="mutate(()=>db.settings.goal=Number(document.getElementById('goal').value)||1000000000)">Simpan Target</button></div><div class="card"><h3>Logo Aplikasi</h3><p class="note">Pilih gambar PNG/JPG. Logo di header berubah langsung. Ikon Home Screen perlu diperbarui melalui file PWA saat deploy.</p><input type="file" accept="image/png,image/jpeg,image/webp" onchange="setLogo(this.files[0])"><div class="buttons" style="margin-top:10px"><button onclick="removeLogo()">Hapus Logo</button></div></div><div class="card"><h3>Backup & Migrasi v8</h3><p class="note">Simpan backup sebelum melakukan impor. Impor mengganti data v9 setelah konfirmasi. Format JSON v8 perlu diverifikasi.</p><div class="buttons"><button class="primary" onclick="backup()">Download Backup JSON</button><button onclick="document.getElementById('importFile').click()">Import Backup</button></div><input id="importFile" type="file" accept=".json,application/json" hidden onchange="importBackup(this.files[0])"><div class="buttons" style="margin-top:10px"><button onclick="exportCSV()">Export Excel (CSV)</button><button onclick="printReport()">Export PDF / Cetak</button></div></div><div class="card"><h3>Keamanan</h3><p class="note">PIN lokal adalah kunci akses sederhana, bukan enkripsi data. Face ID memerlukan implementasi WebAuthn dan hosting HTTPS.</p><button onclick="pinForm()">${db.settings.pinHash?'Ubah / Hapus PIN':'Aktifkan PIN'}</button></div><div class="card"><h3>Informasi</h3><p>Total aset bersih: <b>${fmt(net())}</b></p><p>Jumlah aset: ${db.assets.length} · transaksi: ${db.tx.length}</p><p class="note">Data tersimpan di browser perangkat ini. Membersihkan data situs dapat menghapusnya. Backup secara rutin.</p></div>`}
function render(){const logo=document.getElementById('brandLogo');if(db.settings.logo){logo.src=db.settings.logo;logo.classList.remove('hidden')}else{logo.removeAttribute('src');logo.classList.add('hidden')}document.body.classList.toggle('light',db.settings.theme==='light');document.getElementById('main').innerHTML=({home,assets,transactions,assistant,settings}[current])();document.getElementById('nav').innerHTML=[['home','⌂','Home'],['assets','▣','Aset'],['transactions','⇄','Transaksi'],['assistant','✦','Asisten'],['settings','⚙','Setting']].map(([k,ic,l])=>`<button class="${current===k?'active':''}" onclick="current='${k}';render()"><span>${ic}</span>${l}</button>`).join('');if(current==='home')requestAnimationFrame(drawChart)}function drawChart(){let c=document.getElementById('chart');if(!c)return;let ctx=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=180*devicePixelRatio;ctx.clearRect(0,0,w,h);let days=Number(document.getElementById('period').value),cut=Date.now()-days*86400000,arr=db.snapshots.filter(s=>!days||new Date(s.at).getTime()>=cut);ctx.strokeStyle='#36475b';ctx.lineWidth=1*devicePixelRatio;for(let i=1;i<=3;i++){ctx.beginPath();ctx.moveTo(0,h*i/4);ctx.lineTo(w,h*i/4);ctx.stroke()}if(arr.length<2){ctx.fillStyle='#98a7bb';ctx.font=`${13*devicePixelRatio}px sans-serif`;ctx.fillText('Grafik terbentuk setelah beberapa perubahan data',8,h/2);return}let values=arr.map(s=>s.value),lo=Math.min(...values),hi=Math.max(...values),range=hi-lo||1;ctx.strokeStyle='#65d58a';ctx.lineWidth=2.5*devicePixelRatio;ctx.beginPath();arr.forEach((s,i)=>{let x=i/(arr.length-1)*w,y=h*.9-(s.value-lo)/range*h*.75;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}
function backup(){download('caison-wealth-v9-backup.json',JSON.stringify(db,null,2),'application/json')}function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}function normalizeBackup(raw){let x=raw?.data&&Array.isArray(raw.data.assets)?raw.data:raw;if(!Array.isArray(x.assets))throw Error('Backup tidak memiliki array assets. Format v8 belum dikenali; data tidak diubah.');let assets=x.assets.map(a=>({id:String(a.id||id()),name:String(a.name||a.nama||'Aset'),category:String(a.category||a.kategori||'Lainnya'),kind:a.kind==='debt'||a.type==='debt'||a.type==='utang'?'debt':'asset',value:Number(a.value??a.nominal??a.amount??0),quantity:Number(a.quantity||0),unit:String(a.unit||''),currency:String(a.currency||'IDR')}));if(assets.some(a=>!Number.isFinite(a.value)||a.value<0))throw Error('Nilai aset tidak valid');return {assets,tx:Array.isArray(x.tx)?x.tx:Array.isArray(x.transactions)?x.transactions:[],snapshots:Array.isArray(x.snapshots)?x.snapshots:[],settings:{...db.settings,...(x.settings||{}),pinHash:db.settings.pinHash},version:9}}async function importBackup(file){if(!file)return;try{let raw=JSON.parse(await file.text()),next=normalizeBackup(raw);if(!confirm(`Ditemukan ${next.assets.length} aset dan ${next.tx.length} transaksi. Impor akan MENGGANTI data v9. Pastikan backup v9 sudah disimpan. Lanjut?`))return;db=next;snapshot();save();render();alert('Impor selesai. Periksa kembali seluruh nominal dan transaksi.')}catch(e){alert('Impor dibatalkan: '+e.message)}}function csvCell(s){return '"'+String(s??'').replace(/"/g,'""')+'"'}function exportCSV(){let lines=[['Jenis','Nama','Kategori','Nilai Rupiah','Jumlah Unit','Satuan'],...db.assets.map(a=>[a.kind,a.name,a.category,a.value,a.quantity,a.unit])].map(row=>row.map(csvCell).join(';')).join('\r\n');download('caison-wealth-assets.csv','\ufeff'+lines,'text/csv;charset=utf-8')}function printReport(){let w=window.open('','_blank');if(!w)return alert('Izinkan pop-up untuk mencetak laporan');w.document.write(`<html><head><title>Laporan CAISONSPLY Wealth</title><style>body{font-family:Arial;padding:25px}td,th{border-bottom:1px solid #ddd;padding:9px;text-align:left}table{border-collapse:collapse;width:100%}

</style></head><body><h1>CAISONSPLY Wealth v9 PRO</h1><p>${new Date().toLocaleString('id-ID')}</p><h2>Total Bersih ${fmt(net())}</h2><p>Aset Kotor ${fmt(total(db.assets))} | Utang ${fmt(debts(db.assets))}</p><table><tr><th>Aset</th><th>Kategori</th><th>Nilai</th></tr>${db.assets.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.category)}</td><td>${fmt(a.value)}</td></tr>`).join('')}</table></body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),300)}async function setLogo(file){if(!file)return;if(file.size>2000000)return alert('Gunakan gambar maksimal 2 MB');if(!/^image\/(png|jpeg|webp)$/.test(file.type))return alert('Pilih gambar PNG, JPG atau WebP');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const ctx=c.getContext('2d');ctx.clearRect(0,0,160,160);const scale=Math.min(160/im.width,160/im.height),w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(160-w)/2,(160-h)/2,w,h);mutate(()=>db.settings.logo=c.toDataURL('image/png'));alert('Logo header berhasil diganti')};im.onerror=()=>alert('Gambar tidak dapat dibaca');im.src=data}function removeLogo(){mutate(()=>db.settings.logo='')}function toggleTheme(){mutate(()=>db.settings.theme=db.settings.theme==='dark'?'light':'dark')}async function hash(s){let bytes=new TextEncoder().encode(s),digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join('')}function pinForm(){dialog(`<h2>Atur PIN</h2><p class="note">PIN hanya mencegah akses kasual pada tampilan aplikasi, bukan mengenkripsi penyimpanan.</p><input id="newPin" type="password" inputmode="numeric" placeholder="PIN baru minimal 4 angka"><div class="buttons" style="margin-top:10px"><button class="primary" onclick="setPin()">Simpan PIN</button><button onclick="removePin()">Hapus PIN</but
